# Netlify configuration for knomad.
#
# The app is a Vite project: the browser cannot load the source tree directly
# because main.js and sync.js use bare module specifiers ("@neondatabase/auth",
# "@neon/realtime/client") that only Vite resolves. Publishing the repository
# root therefore breaks every interaction with a module-resolution error.
#
# Build first, then publish the bundled output in dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Single-page app fallback. Netlify serves real files first, so hashed assets
# and index.html are unaffected; this only catches unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
